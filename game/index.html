<style>
  html, body { margin: 0; padding: 0; background: #241832; height: 100%; }

</style>

<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hint">Space / Click to jump &middot; Shift / Right-click to pounce &middot; P pause &middot; R restart &middot; M mute</div>
</div>
<script type="module" src="./src/main.js"></script>
